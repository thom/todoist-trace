[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todoist-trace"
version = "0.1.0"
description = "Interactive HTML dashboard and Markdown/CSV exporter to explore your Todoist activity with full project & task hierarchies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Thomas Weibel", email = "thom@ikhono.net" }
]
keywords = ["todoist", "productivity", "trace", "export", "sqlite", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/thom/todoist-trace"
Repository = "https://github.com/thom/todoist-trace.git"
Issues = "https://github.com/thom/todoist-trace/issues"

[project.scripts]
todoist-trace = "todoist_trace.main:main"
todoist_trace = "todoist_trace.main:main"

[tool.setuptools.packages.find]
include = ["todoist_trace*"]
